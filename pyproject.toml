[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-runtime"
version = "0.1.0"
description = "Trace-based Runtime Automata for Compliance and Enforcement"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TRACE Research Team" }
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "sqlalchemy>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "httpx>=0.24",  # required by fastapi.testclient in API tests
]

[project.scripts]
trace = "trace_entrypoint:main"

[tool.setuptools]
py-modules = ["trace_entrypoint"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trace*"]

[tool.pytest.ini_options]
testpaths = ["trace/tests"]
python_files = "test_*.py"
pythonpath = ["."]
